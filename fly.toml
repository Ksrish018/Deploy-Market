# Fly.io app config. `app` must be globally unique on Fly — if the name
# below is taken, change it here to match whatever `fly apps create` gives
# you before running `fly deploy`.
app = "market-signal-triage"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "msdata"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
